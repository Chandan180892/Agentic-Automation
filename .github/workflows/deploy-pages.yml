# Publishes the design prototype to GitHub Pages. The app itself is a server
# application and is deployed separately — see the deploy section of the README.
name: Deploy prototype to Pages

on:
  push:
    branches: [main, claude/ai-agent-sprint-app-8a2yxn]
    paths: ["docs/**", ".github/workflows/deploy-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the Pages bundle
        run: |
          mkdir -p _site
          cp docs/index.html _site/index.html
          # Pages runs Jekyll by default, which would swallow files it does not recognise.
          touch _site/.nojekyll

      # enablement turns Pages on for the repo if it is not already, so no manual
      # visit to Settings → Pages is needed for the first deploy.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
