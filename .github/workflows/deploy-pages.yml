# Publishes docs/ — the in-browser Autopilot app (index.html) and the screen prototype — to GitHub
# Pages. The server app is deployed separately; see the deploy section of the README.
#
# The site is currently served with Pages set to "Deploy from a branch" (the default branch,
# /docs), which needs no workflow. This workflow is for Pages set to "GitHub Actions"; run it by
# hand after switching, and add a push trigger back if you keep that setup.
name: Deploy site to Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the Pages bundle
        run: |
          mkdir -p _site
          cp -r docs/. _site/
          # Pages runs Jekyll by default, which would swallow files it does not recognise.
          touch _site/.nojekyll

      # enablement turns Pages on for the repo if it is not already, so no manual
      # visit to Settings → Pages is needed for the first deploy.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
